# Thème Mine de Ketchup (sombre, chaleureux, artisanal).
# Le reste de l'habillage est dans lib/branding.py.
[theme]
base = "dark"
primaryColor = "#D8452F"
backgroundColor = "#14100E"
secondaryBackgroundColor = "#1D1815"
textColor = "#F4ECE2"
font = "sans serif"

[client]
showErrorDetails = true

# Le menu latéral listait « Tableau de bord » à tous les visiteurs. La page est
# protégée par mot de passe, mais autant ne pas annoncer son existence aux
# détaillants : on masque la navigation, et le tableau de bord se rejoint
# directement par son adresse (.../Tableau_de_bord), à mettre en favori.
showSidebarNavigation = false

[browser]
gatherUsageStats = false
